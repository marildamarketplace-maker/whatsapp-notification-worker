services:
  whatsapp-worker:
    build: .
    image: whatsapp-notification-worker:local
    container_name: whatsapp-notification-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0700
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
